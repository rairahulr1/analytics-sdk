name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://your-vps-domain.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH known hosts and key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Pull latest code and deploy
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /var/www/analytics-sdk
            git pull origin main
            docker compose down
            docker compose up --build -d
            docker exec analytics-laravel php artisan migrate --force
            docker exec analytics-laravel php artisan db:seed --force
          "

      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            curl -s -o /dev/null -w '%{http_code}' https://your-vps-domain.com
          "