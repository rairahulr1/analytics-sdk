name: Analytics SDK CI/CD

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  # Job: Run tests on pull requests
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    services:
      # Define PostgreSQL service for testing
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: analytics_test
          POSTGRES_USER: analytics_user
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analytics_user -d analytics_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # composer.json requires php: ^8.3
          php-version: '8.3'
          extensions: pdo pdo_pgsql pgsql mbstring exif pcntl bcmath zip

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm install

      - name: Setup test database environment
        run: |
          cp .env.example .env
          {
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=analytics_test"
            echo "DB_USERNAME=analytics_user"
            echo "DB_PASSWORD=secret"
          } >> .env

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Run migrations and seed
        run: php artisan migrate:fresh --seed --force

      - name: Run test suite
        env:
          # phpunit.xml pins DB_CONNECTION=sqlite / DB_DATABASE=:memory: via
          # <env> entries, which do NOT override real environment variables.
          # These step-level values make the PHPUnit run target the Postgres
          # service container defined above instead of in-memory SQLite.
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: analytics_test
          DB_USERNAME: analytics_user
          DB_PASSWORD: secret
        run: php artisan test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures
          path: storage/logs/*.log
